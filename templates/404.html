<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found - SunRest Hotel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .error-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; }
        h1 { color: #e74c3c; font-size: 80px; margin: 0; }
        h2 { color: #333; }
        p { color: #666; margin-bottom: 20px; }
        a { background: #3498db; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; display: inline-block; transition: 0.3s; font-weight: bold; }
        a:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Oops! Room Not Found</h2>
        <p>The hallway you are walking down doesn't seem to exist. Let's get you back to the reception.</p>
        <a href="/">Return to Lobby</a>
    </div>
</body>
</html>
