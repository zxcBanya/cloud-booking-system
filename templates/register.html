<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Sunway Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px;}
        button:hover { background: #219150; }
        .error { color: #e74c3c; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Account</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <!-- Added pattern matching for HTML5 basic validation -->
            <input type="text" name="username" placeholder="Choose a Username" required pattern="[a-zA-Z0-9_]+" title="Only English letters, numbers, and underscores allowed">
            <input type="password" name="password" placeholder="Create a Password" required>
            <!-- Added confirmation password field -->
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login">Login here</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
