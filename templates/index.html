<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunway Room Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .nav-links a { margin-left: 15px; text-decoration: none; padding: 8px 15px; border-radius: 5px; color: white; }
        .btn-login { background: #3498db; }
        .btn-register { background: #27ae60; }
        .btn-logout { background: #e74c3c; }
        .btn-add { background: #8e44ad; }
        h1 { text-align: center; color: #333; margin-top: 0; }
        .room-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .room-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; display: flex; flex-direction: column;}
        .room-image { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #7f8c8d; font-weight: bold;}
        .room-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .room-price { color: #27ae60; font-size: 22px; margin-bottom: 15px; font-weight: bold; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; margin-top: auto;}
        .btn:hover { background: #2980b9; }
        .booked { background: #95a5a6; cursor: not-allowed; }
        .booked:hover { background: #7f8c8d; }
        .btn-cancel { background: #e67e22; }
        .btn-cancel:hover { background: #d35400; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏠 Sunway Area Room Booking</h2>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <span style="margin-right: 15px; font-weight: bold;">Welcome, {{ current_user.username }}!</span>
                <!-- NEW: Button to access the add room page -->
                <a href="/add_room" class="btn-add">Add Room</a>
                <a href="/logout" class="btn-logout">Logout</a>
            {% else %}
                <a href="/login" class="btn-login">Login</a>
                <a href="/register" class="btn-register">Register</a>
            {% endif %}
        </div>
    </div>

    <div class="room-container" id="rooms">
        <!-- Rooms will be loaded here from the database -->
    </div>

    <script>
        fetch('/rooms')
            .then(response => response.json())
            .then(rooms => {
                const container = document.getElementById('rooms');
                rooms.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'room-card';
                    
                    let buttonHtml = '';
                    if (room.is_booked) {
                        if (room.is_my_booking) {
                            buttonHtml = `<button class="btn btn-cancel" onclick="cancelBooking(${room.id})">Cancel Booking</button>`;
                        } else {
                            buttonHtml = `<button class="btn booked" disabled>Already Booked</button>`;
                        }
                    } else {
                        buttonHtml = `<button class="btn" onclick="bookRoom(${room.id})">Book Now</button>`;
                    }

                    // NEW LOGIC: Display image if it exists, otherwise show placeholder
                    let imageHtml = '';
                    if (room.image_url) {
                        imageHtml = `<img src="/static/uploads/${room.image_url}" class="room-image" alt="${room.title}">`;
                    } else {
                        imageHtml = `<div class="room-image">No Image</div>`;
                    }

                    card.innerHTML = `
                        ${imageHtml}
                        <div class="room-title">${room.title}</div>
                        <div class="room-price">RM ${room.price} / month</div>
                        ${buttonHtml}
                    `;
                    container.appendChild(card);
                });
            });

        function bookRoom(id) {
            {% if not current_user.is_authenticated %}
                alert("Please login to book a room!");
                window.location.href = "/login";
                return;
            {% endif %}

            fetch(`/book/${id}`, { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if(data.message) {
                    alert(data.message); 
                    location.reload();   
                } else {
                    alert(data.error);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function cancelBooking(id) {
            if(confirm("Are you sure you want to cancel this booking?")) {
                fetch(`/unbook/${id}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if(data.message) {
                        alert(data.message); 
                        location.reload();   
                    } else {
                        alert(data.error);
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }
    </script>

</body>
</html>
