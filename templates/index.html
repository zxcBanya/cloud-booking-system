<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunRest Hotel Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .nav-links a { margin-left: 15px; text-decoration: none; padding: 8px 15px; border-radius: 5px; color: white; }
        .btn-login { background: #3498db; }
        .btn-register { background: #27ae60; }
        .btn-logout { background: #e74c3c; }
        h1 { text-align: center; color: #333; margin-top: 0; }
        .room-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .room-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; text-align: center; display: flex; flex-direction: column;}
        .room-image { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #7f8c8d; font-weight: bold;}
        .room-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .room-price { color: #27ae60; font-size: 20px; margin-bottom: 15px; font-weight: bold; }
        
        /* Calendar Styles */
        .date-container { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 5px;}
        .date-container label { font-size: 13px; color: #555; font-weight: bold; }
        .date-input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
        
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; margin-top: auto;}
        .btn:hover { background: #2980b9; }
        .booked { background: #95a5a6; cursor: not-allowed; }
        .btn-cancel { background: #e67e22; }
        .btn-cancel:hover { background: #d35400; }
        .status-text { color: #e74c3c; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏨 SunRest Hotel</h2>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <span style="font-weight: bold; margin-right: 15px;">Welcome, {{ current_user.username }}!</span>
                <a href="/logout" class="btn-logout">Logout</a>
            {% else %}
                <a href="/login" class="btn-login">Login</a>
                <a href="/register" class="btn-register">Register</a>
            {% endif %}
        </div>
    </div>

    <div class="room-container" id="rooms"></div>

    <script>
        // ЛОГИКА КАЛЕНДАРЯ: Вычисляем дату "завтра"
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        // Форматируем дату в YYYY-MM-DD для HTML атрибута min
        const year = tomorrow.getFullYear();
        const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
        const day = String(tomorrow.getDate()).padStart(2, '0');
        const minDateStr = `${year}-${month}-${day}`;

        fetch('/rooms')
            .then(response => response.json())
            .then(rooms => {
                const container = document.getElementById('rooms');
                rooms.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'room-card';
                    
                    let actionHtml = '';
                    
                    if (room.is_booked) {
                        if (room.is_my_booking) {
                            actionHtml += `<div class="status-text">Booked: ${room.check_in} to ${room.check_out}</div>`;
                            actionHtml += `<button class="btn btn-cancel" onclick="cancelBooking(${room.id})">Cancel Booking</button>`;
                        } else {
                            actionHtml += `<div class="status-text" style="color:#7f8c8d;">Unavailable for these dates</div>`;
                            actionHtml += `<button class="btn booked" disabled>Already Booked</button>`;
                        }
                    } else {
                        // ПРИМЕНЯЕМ ОГРАНИЧИТЕЛЬ: min="${minDateStr}"
                        actionHtml += `
                            <div class="date-container">
                                <label>Check-in Date:</label>
                                <input type="date" id="checkin_${room.id}" class="date-input" min="${minDateStr}">
                                <label>Check-out Date:</label>
                                <input type="date" id="checkout_${room.id}" class="date-input" min="${minDateStr}">
                            </div>
                            <button class="btn" onclick="bookRoom(${room.id})">Reserve Room</button>
                        `;
                    }

                    let imageHtml = room.image_url 
                        ? `<img src="/static/uploads/${room.image_url}" class="room-image" alt="${room.title}" onerror="this.src=''; this.alt='Image not found';">`
                        : `<div class="room-image">No Image</div>`;

                    card.innerHTML = `
                        ${imageHtml}
                        <div class="room-title">${room.title}</div>
                        <div class="room-price">RM ${room.price} / night</div>
                        <div style="margin-top: auto;">${actionHtml}</div>
                    `;
                    container.appendChild(card);
                });
            });

        function bookRoom(id) {
            {% if not current_user.is_authenticated %}
                alert("Please login to book a room!");
                window.location.href = "/login";
                return;
            {% endif %}

            const checkIn = document.getElementById(`checkin_${id}`).value;
            const checkOut = document.getElementById(`checkout_${id}`).value;

            if (!checkIn || !checkOut) {
                alert("Please select both check-in and check-out dates.");
                return;
            }
            if (new Date(checkIn) >= new Date(checkOut)) {
                alert("Check-out date must be after check-in date.");
                return;
            }

            const formData = new FormData();
            formData.append('check_in', checkIn);
            formData.append('check_out', checkOut);

            fetch(`/book/${id}`, { 
                method: 'POST',
                body: formData
            })
            .then(res => res.json()).then(data => { alert(data.message || data.error); location.reload(); });
        }

        function cancelBooking(id) {
            if(confirm("Cancel this reservation?")) {
                fetch(`/unbook/${id}`, { method: 'POST' })
                .then(res => res.json()).then(data => { alert(data.message || data.error); location.reload(); });
            }
        }
    </script>
</body>
</html>
