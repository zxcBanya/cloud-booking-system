<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunway Room Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .nav-links a { margin-left: 15px; text-decoration: none; padding: 8px 15px; border-radius: 5px; color: white; }
        .btn-login { background: #3498db; }
        .btn-register { background: #27ae60; }
        .btn-logout { background: #e74c3c; }
        .btn-add { background: #8e44ad; }
        h1 { text-align: center; color: #333; margin-top: 0; }
        .room-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .room-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; display: flex; flex-direction: column;}
        .room-image { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #7f8c8d; font-weight: bold;}
        .room-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .room-price { color: #27ae60; font-size: 22px; margin-bottom: 15px; font-weight: bold; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; margin-top: 5px;}
        .btn:hover { background: #2980b9; }
        .booked { background: #95a5a6; cursor: not-allowed; }
        .booked:hover { background: #7f8c8d; }
        .btn-cancel { background: #e67e22; }
        .btn-cancel:hover { background: #d35400; }
        .btn-edit { background: #f39c12; }
        .btn-edit:hover { background: #e67e22; }
        .btn-delete { background: #c0392b; }
        .btn-delete:hover { background: #a5281b; }
        .role-badge { font-size: 12px; background: #eee; padding: 3px 8px; border-radius: 10px; color: #555; margin-left: 10px; vertical-align: middle;}
    </style>
</head>
<body>

    <div class="header">
        <h2>🏠 Sunway Area Room Booking</h2>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <span style="font-weight: bold;">Welcome, {{ current_user.username }}!</span>
                <span class="role-badge">{{ current_user.role|capitalize }}</span>
                
                <!-- SHOW 'ADD ROOM' ONLY TO LANDLORDS -->
                {% if current_user.role == 'landlord' %}
                    <a href="/add_room" class="btn-add">Add Room</a>
                {% endif %}
                
                <a href="/logout" class="btn-logout" style="margin-left: 15px;">Logout</a>
            {% else %}
                <a href="/login" class="btn-login">Login</a>
                <a href="/register" class="btn-register">Register</a>
            {% endif %}
        </div>
    </div>

    <div class="room-container" id="rooms"></div>

    <script>
        fetch('/rooms')
            .then(response => response.json())
            .then(rooms => {
                const container = document.getElementById('rooms');
                rooms.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'room-card';
                    
                    let actionHtml = '';
                    
                    // 1. Tenant/Booking Controls
                    if (room.is_booked) {
                        if (room.is_my_booking) {
                            actionHtml += `<button class="btn btn-cancel" onclick="cancelBooking(${room.id})">Cancel Booking</button>`;
                        } else {
                            actionHtml += `<button class="btn booked" disabled>Already Booked</button>`;
                        }
                    } else {
                        actionHtml += `<button class="btn" onclick="bookRoom(${room.id})">Book Now</button>`;
                    }

                    // 2. Landlord/Owner Controls
                    if (room.is_my_listing) {
                        actionHtml += `<button class="btn btn-edit" onclick="window.location.href='/edit_room/${room.id}'">Edit Room</button>`;
                        actionHtml += `<button class="btn btn-delete" onclick="deleteRoom(${room.id})">Delete Room</button>`;
                    }

                    let imageHtml = room.image_url 
                        ? `<img src="/static/uploads/${room.image_url}" class="room-image" alt="${room.title}">`
                        : `<div class="room-image">No Image</div>`;

                    card.innerHTML = `
                        ${imageHtml}
                        <div class="room-title">${room.title}</div>
                        <div class="room-price">RM ${room.price} / month</div>
                        <div style="margin-top: auto;">${actionHtml}</div>
                    `;
                    container.appendChild(card);
                });
            });

        function bookRoom(id) {
            {% if not current_user.is_authenticated %}
                alert("Please login to book a room!");
                window.location.href = "/login";
                return;
            {% endif %}
            fetch(`/book/${id}`, { method: 'POST' })
            .then(res => res.json()).then(data => { alert(data.message || data.error); location.reload(); });
        }

        function cancelBooking(id) {
            if(confirm("Cancel this booking?")) {
                fetch(`/unbook/${id}`, { method: 'POST' })
                .then(res => res.json()).then(data => { alert(data.message || data.error); location.reload(); });
            }
        }

        function deleteRoom(id) {
            if(confirm("Are you sure you want to permanently delete this room?")) {
                fetch(`/delete_room/${id}`, { method: 'POST' })
                .then(res => res.json()).then(data => { alert(data.message || data.error); location.reload(); });
            }
        }
    </script>
</body>
</html>
